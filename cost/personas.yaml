    inputs: ['{"mode": "task", "diff_id": "repo01_c1"}', '{"mode": "task", "diff_id": "repo02_c1"}', '{"mode": "task", "diff_id": "repo05_c1"}', '{"mode": "task", "diff_id": "repo06_c1"}', '{"mode": "task", "diff_id": "repo07_c1"}', '{"mode": "task", "diff_id": "repo09_c1"}', '{"mode": "task", "diff_id": "repo12_c1"}']
