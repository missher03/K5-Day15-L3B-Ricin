    inputs: ['{"mode": "task", "diff_id": "repo02_c1"}', '{"mode": "task", "diff_id": "repo03_c1"}', '{"mode": "task", "diff_id": "repo04_c1"}', '{"mode": "task", "diff_id": "repo06_c1"}', '{"mode": "task", "diff_id": "repo08_c1"}', '{"mode": "task", "diff_id": "repo09_c1"}']

